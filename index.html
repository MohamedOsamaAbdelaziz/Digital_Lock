<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قفل بالصوت</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14181f;--mut:#5b6573;--ac:#1f6feb;--ok:#1a7f37;--bad:#cf222e;--bd:#d6dce3;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#171c23;--tx:#e8ecf1;--mut:#9aa5b3;--ac:#58a6ff;--ok:#3fb950;--bad:#ff7b72;--bd:#2a323c;--in:#0e1217}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#171c23;--tx:#e8ecf1;--mut:#9aa5b3;--ac:#58a6ff;--ok:#3fb950;--bad:#ff7b72;--bd:#2a323c;--in:#0e1217}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font-size:1rem}
button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600;margin-top:10px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd);color:var(--mut)}
.chip.on{color:var(--ok);border-color:var(--ok)}
#heard{min-height:1.6em;font-size:1.1rem;margin-top:8px}
#log{font-size:.85rem;max-height:180px;overflow:auto;color:var(--mut)}
#log .ok{color:var(--ok)}#log .bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>🔐 قفل بالصوت</h1>

<div class="card">
  <span id="st" class="chip">غير متصل</span>
  <button id="conn">الاتصال بالقفل (HM-10)</button>
</div>

<div class="card">
  <label for="phrase">العبارة السرية</label>
  <input id="phrase" placeholder="مثلاً: افتح ">
  <label for="lang">لغة الكلام</label>
  <select id="lang"><option value="ar-EG">عربي (مصر)</option><option value="en-US">English</option></select>
  <label for="token">الرسالة اللي بتتبعت للقفل (لازم تطابق PHONE_TOKEN في الكود)</label>
  <input id="token" value="VOICE_OK" dir="ltr">
  <button id="mic">🎤 اضغط وقول العبارة</button>
  <div id="heard"></div>
</div>

<div class="card">
  <button id="test" class="sec">إرسال الرسالة مباشرة (اختبار)</button>
  <div id="log"></div>
</div>
</main>

<script>
var SVC='0000ffe0-0000-1000-8000-00805f9b34fb', CH='0000ffe1-0000-1000-8000-00805f9b34fb';
var ch=null;
function $(id){return document.getElementById(id)}
function load(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function log(t,c){var d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+'  '+t;if(c)d.className=c;$('log').prepend(d)}
function norm(s){return s.toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim()}
function setConn(on,name){var s=$('st');s.textContent=on?('متصل: '+(name||'')):'غير متصل';s.className='chip'+(on?' on':'')}

['phrase','lang','token'].forEach(function(id){
  var el=$(id);var v=load('vl_'+id,'');if(v)el.value=v;
  el.addEventListener('change',function(){save('vl_'+id,el.value)});
});

async function connect(){
  if(!navigator.bluetooth){log('المتصفح لا يدعم Bluetooth. افتح الرابط من Chrome على أندرويد','bad');return}
  try{
    var dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});
    dev.addEventListener('gattserverdisconnected',function(){ch=null;setConn(false);log('انقطع الاتصال','bad')});
    var srv=await dev.gatt.connect();
    var s=await srv.getPrimaryService(SVC);
    ch=await s.getCharacteristic(CH);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',function(e){log('القفل: '+new TextDecoder().decode(e.target.value).trim())});
    setConn(true,dev.name);log('تم الاتصال','ok');
  }catch(e){log('فشل الاتصال: '+e.message,'bad')}
}

async function sendText(t){
  if(!ch){log('مش متوصل بالقفل','bad');return}
  var b=new TextEncoder().encode(t+'\n');
  try{
    for(var i=0;i<b.length;i+=20){
      var p=b.slice(i,i+20);
      if(ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);
    }
    log('اتبعتت الرسالة','ok');
  }catch(e){log('فشل الإرسال: '+e.message,'bad')}
}

function listen(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){log('المتصفح لا يدعم التعرف على الصوت. استخدم Chrome','bad');return}
  var phrase=norm($('phrase').value);
  if(!phrase){log('اكتب العبارة السرية الأول','bad');return}
  var rec=new SR();
  rec.lang=$('lang').value;rec.interimResults=false;rec.maxAlternatives=3;
  rec.onresult=function(e){
    var alts=Array.prototype.map.call(e.results[0],function(a){return norm(a.transcript)});
    $('heard').textContent=e.results[0][0].transcript;
    if(alts.some(function(a){return a.indexOf(phrase)!==-1})){log('العبارة مطابقة','ok');sendText($('token').value)}
    else log('العبارة مش مطابقة','bad');
  };
  rec.onerror=function(e){log('خطأ في الميكروفون: '+e.error,'bad')};
  rec.onend=function(){$('mic').disabled=false;$('mic').textContent='🎤 اضغط وقول العبارة'};
  $('mic').disabled=true;$('mic').textContent='بسمعك...';$('heard').textContent='';
  try{rec.start()}catch(e){log('تعذر تشغيل الميكروفون','bad');$('mic').disabled=false}
}

$('conn').addEventListener('click',connect);
$('mic').addEventListener('click',listen);
$('test').addEventListener('click',function(){sendText($('token').value)});
</script>
</body>
</html>
